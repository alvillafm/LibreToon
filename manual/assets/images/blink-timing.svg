<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">The four keys of a blink</title><desc id="desc">Open on frame 1, half closed on 9, closed on 11, open again on 13; exposures hold between keys.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3Z" fill="#82b7ff"/></marker></defs><rect width="1200" height="420" rx="20" fill="#202738"/><g font-family="system-ui, sans-serif"><text x="36" y="48" font-size="28" fill="#e7ebf5" text-anchor="start">The four keys of a blink</text><text x="36" y="80" font-size="15" fill="#a5b5ce" text-anchor="start">EXPLANATORY DIAGRAM · not an application screenshot</text><rect x="48" y="142" width="42" height="64" rx="5" fill="#345f81"/><text x="69" y="130" font-size="16" fill="#e7ebf5" text-anchor="middle">1</text><circle cx="69" cy="174" r="7" fill="#ffffff"/><rect x="94" y="142" width="42" height="64" rx="5" fill="#345f81"/><text x="115" y="130" font-size="16" fill="#e7ebf5" text-anchor="middle">2</text><rect x="140" y="142" width="42" height="64" rx="5" fill="#345f81"/><text x="161" y="130" font-size="16" fill="#e7ebf5" text-anchor="middle">3</text><rect x="186" y="142" width="42" height="64" rx="5" fill="#345f81"/><text x="207" y="130" font-size="16" fill="#e7ebf5" text-anchor="middle">4</text><rect x="232" y="142" width="42" height="64" rx="5" fill="#345f81"/><text x="253" y="130" font-size="16" fill="#e7ebf5" text-anchor="middle">5</text><rect x="278" y="142" width="42" height="64" rx="5" fill="#345f81"/><text x="299" y="130" font-size="16" fill="#e7ebf5" text-anchor="middle">6</text><rect x="324" y="142" width="42" height="64" rx="5" fill="#345f81"/><text x="345" y="130" font-size="16" fill="#e7ebf5" text-anchor="middle">7</text><rect x="370" y="142" width="42" height="64" rx="5" fill="#345f81"/><text x="391" y="130" font-size="16" fill="#e7ebf5" text-anchor="middle">8</text><rect x="416" y="14