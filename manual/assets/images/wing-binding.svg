<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">A tiny rig you can understand</title><desc id="desc">A torso root is the parent of a wing bone. Each symbol has a rigid binding to its corresponding bone. Pose the child to move only the wing.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3Z" fill="#82b7ff"/></marker></defs><rect width="1200" height="420" rx="20" fill="#202738"/><g font-family="system-ui, sans-serif"><text x="36" y="48" font-size="28" fill="#e7ebf5" text-anchor="start">A tiny rig you can understand</text><text x="36" y="80" font-size="15" fill="#a5b5ce" text-anchor="start">EXPLANATORY DIAGRAM · not an application screenshot</text><path d="M250 300 V155" stroke="#68d8ca" stroke-width="16" stroke-linecap="round"/><path d="M730 160 L760 310" stroke="#82b7ff" stroke-width="16" stroke-linecap="round"/><circle cx="250" cy="300" r="12" fill="#202738" stroke="#e7ebf5" stroke-width="3"/><circle cx="250" cy="155" r="12" fill="#202738" stroke="#e7ebf5" stroke-width="3"/><circle cx="730" cy="160" r="12" fill="#202738" stroke="#e7ebf5" stroke-width="3"/><circle cx="760" cy="310" r="12" fill="#202738" stroke="#e7ebf5" stroke-width="3"/><path d="M270 160 H705" stroke="#82b7ff" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/><path d="M770 160 Q880 170 885 280" fill="none" stroke="#f1c278" stroke-width="4" marker-end="url(#arrow)"/><text x="250" y="123" font-size="24" fill="#e7ebf5" text-anchor="middle">BODY · root</text><text x="750" y="123" font-size="24" fill="#e7ebf5" text-anchor="middle">WING · child</text><text x="420" y="200" font-size="20" fill="#a5b5ce" text-anchor="start">parent → child</text><text x="905" y="235" font-size="20" fill="#f1c278" text-anchor="start">Pose this bone</text><text x="250" y="355" font-size="20" fill="#e7ebf5" text-anchor="middle">Body symbol follows Body</text><text x="780" y="355" font-size="20" fill="#e7ebf5" text-anchor="middle">Wing symbol follows Wing</text></g></svg>