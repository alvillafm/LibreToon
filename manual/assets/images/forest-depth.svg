<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Three layers, three distances</title><desc id="desc">The example places distant trees at 1500, the owl at 1000 and foreground foliage at 650. This is a conceptual depth diagram.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3Z" fill="#82b7ff"/></marker></defs><rect width="1200" height="420" rx="20" fill="#202738"/><g font-family="system-ui, sans-serif"><text x="36" y="48" font-size="28" fill="#e7ebf5" text-anchor="start">Three layers, three distances</text><text x="36" y="80" font-size="15" fill="#a5b5ce" text-anchor="start">EXPLANATORY DIAGRAM · not an application screenshot</text><path d="M110 130 l240 -20 v150 l-240 20Z" fill="#344e68" stroke="#8fa9c4" stroke-width="2"/><text x="230" y="182" font-size="20" fill="#e7ebf5" text-anchor="middle">BACKGROUND</text><text x="230" y="220" font-size="18" fill="#e7ebf5" text-anchor="middle">Distance 1500</text><path d="M430 165 l240 -20 v150 l-240 20Z" fill="#8d6149" stroke="#8fa9c4" stroke-width="2"/><text x="550" y="217" font-size="20" fill="#e7ebf5" text-anchor="middle">OWL</text><text x="550" y="255" font-size="18" fill="#e7ebf5" text-anchor="middle">Distance 1000</text><path d="M750 200 l240 -20 v150 l-240 20Z" fill="#245650" stroke="#8fa9c4" stroke-width="2"/><text x="870" y="252" font-size="20" fill="#e7ebf5" text-anchor="middle">FOREGROUND</text><text x="870" y="290" font-size="18" fill="#e7ebf5" text-anchor="middle">Distance 650</text><path d="M150 345 H1060" stroke="#82b7ff" stroke-width="4" marker-end="url(#arrow)"/><text x="160" y="385" font-size="19" fill="#a5b5ce" text-anchor="start">Further from camera</text><text x="1050" y="385" font-size="19" fill="#a5b5ce" text-anchor="end">Closer to camera</text></g></svg>