name: LibreToon manual packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to package
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
          - linux
      windows_signing:
        description: Windows signing (Azure requires configured verified identity)
        type: choice
        default: none
        options:
          - none
          - azure

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  windows:
    name: Windows portable ZIP and EXE installer
    needs: format
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # Used only by the explicitly selected Azure signing step.
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      LIBRETOON_SIGNING_MODE: ${{ inputs.windows_signing || 'none' }}
      WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
      WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
      WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
      LIBRETOON_TEST_FONT: ${{ github.workspace }}/assets/fonts/NotoSansCJK-Regular.ttc
    steps:
      - uses: actions/checkout@v4

      - name: Validate optional signing configuration
        if: inputs.windows_signing == 'azure'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {throw 'Signed builds require main and its configured OIDC federation'}
          foreach ($name in @('AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','WINDOWS_SIGNING_ENDPOINT','WINDOWS_SIGNING_ACCOUNT','WINDOWS_SIGNING_PROFILE')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {throw "Missing repository variable: $name"}
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1

      - name: Isolate application and test data
        shell: pwsh
        run: |
          $tempDir = Join-Path $env:RUNNER_TEMP "libretoon-tests"
          $appDataDir = Join-Path $env:RUNNER_TEMP "libretoon-appdata"
          New-Item -ItemType Directory -Force $tempDir, $appDataDir | Out-Null
          "TEMP=$tempDir" >> $env:GITHUB_ENV
          "TMP=$tempDir" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$appDataDir" >> $env:GITHUB_ENV

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2

      - name: Install Python for packaging regression checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check lightweight package staging
        run: python scripts/packaging/test_native.py

      - name: Test package security gates without external services
        run: python scripts/packaging/test_security.py

      - name: Run application regression tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $pf = [Environment]::GetFolderPath("ProgramFilesX86")
          if (-not (Test-Path "$pf/Inno Setup 6/ISCC.exe") -and -not (Test-Path "$pf/Inno Setup 7/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) {throw "Inno Setup installation failed"}
          }

      - name: Authenticate optional Azure signing with OIDC
        if: inputs.windows_signing == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3, verified upstream commit
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install optional signing integration
        if: inputs.windows_signing == 'azure'
        shell: pwsh
        run: Install-Module ArtifactSigning -RequiredVersion 0.1.8 -Scope CurrentUser -Repository PSGallery -Force -AllowClobber

      - name: Create portable ZIP and installer (including optional component signatures)
        shell: pwsh
        run: ./scripts/packaging/windows.ps1 -SigningMode $env:LIBRETOON_SIGNING_MODE

      - name: Verify metadata, signatures, hashes and Microsoft Defender scan
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/packaging/windows-security.ps1 -SigningMode $env:LIBRETOON_SIGNING_MODE

      - name: Upload Windows portable package after security checks
        id: windows-portable
        uses: actions/upload-artifact@v4
        with:
          name: LibreToon-Windows-x64-Portable-${{ inputs.windows_signing == 'azure' && 'signed' || 'unsigned' }}
          path: |
            dist/*-Portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Windows installer after security checks
        id: windows-installer
        uses: actions/upload-artifact@v4
        with:
          name: LibreToon-Windows-x64-Installer-${{ inputs.windows_signing == 'azure' && 'signed' || 'unsigned' }}
          path: |
            dist/*-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Windows security diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LibreToon-Windows-security-report
          path: work/package-security/windows/
          if-no-files-found: warn
          retention-days: 30

      - name: Windows download summary
        shell: pwsh
        env:
          PORTABLE_URL: ${{ steps.windows-portable.outputs.artifact-url }}
          INSTALLER_URL: ${{ steps.windows-installer.outputs.artifact-url }}
        run: |
          "[Portable ZIP]($env:PORTABLE_URL) | [EXE installer]($env:INSTALLER_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Signing mode: **$env:LIBRETOON_SIGNING_MODE**. GitHub wraps each artifact in a ZIP. Passing antivirus checks does not guarantee that Chrome/SmartScreen will accept a download." >> $env:GITHUB_STEP_SUMMARY


  native:
    name: ${{ matrix.label }} packages
    needs: format
    if: inputs.platform == 'all' || inputs.platform == 'macos' || inputs.platform == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            label: macOS-arm64
          - os: macos-15-intel
            platform: macos
            label: macOS-x64
          - os: ubuntu-22.04
            platform: linux
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      LIBRETOON_TEST_FONT: ${{ github.workspace }}/assets/fonts/NotoSansCJK-Regular.ttc
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python for source and packaging scripts
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Linux build and desktop prerequisites
        if: matrix.platform == 'linux' && (inputs.platform == 'all' || inputs.platform == 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libssl-dev libasound2-dev xvfb squashfs-tools desktop-file-utils clamav clamav-freshclam

      - name: Install macOS build prerequisites
        if: matrix.platform == 'macos' && (inputs.platform == 'all' || inputs.platform == 'macos')
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          brew install clamav

      - name: Isolate application and test data
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/libretoon-tests" "$RUNNER_TEMP/libretoon-appdata"
          echo "TEMP=$RUNNER_TEMP/libretoon-tests" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP/libretoon-tests" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/libretoon-tests/" >> "$GITHUB_ENV"
          echo "LOCALAPPDATA=$RUNNER_TEMP/libretoon-appdata" >> "$GITHUB_ENV"

      - name: Cache Rust compilation
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        uses: Swatinem/rust-cache@v2

      - name: Check lightweight package staging
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        run: python3 scripts/packaging/test_native.py

      - name: Test package security gates without external services
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        run: python3 scripts/packaging/test_security.py

      - name: Run application regression tests
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        run: cargo test --locked

      - name: Build release application
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        run: cargo build --release --locked

      - name: Create lightweight native download packages
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/packaging/native.py ${{ matrix.platform }}

      - name: Prepare Ubuntu ClamAV updater
        if: matrix.platform == 'linux' && (inputs.platform == 'all' || inputs.platform == matrix.platform)
        # Avoid a concurrent updater holding the distro database/log lock.
        # Keep the distribution's configuration, certificates and confinement.
        run: sudo systemctl stop clamav-freshclam.service

      - name: Scan native payload and packages with updated ClamAV
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        timeout-minutes: 20
        env:
          LIBRETOON_CLAMAV_MODE: ${{ matrix.platform == 'linux' && 'ubuntu-system' || 'isolated' }}
        run: python3 scripts/packaging/security_native.py

      - name: Upload native download packages
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        uses: actions/upload-artifact@v4
        with:
          name: LibreToon-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload native security diagnostics
        if: always() && (inputs.platform == 'all' || inputs.platform == matrix.platform)
        uses: actions/upload-artifact@v4
        with:
          name: LibreToon-${{ matrix.label }}-security-report
          path: work/package-security/native/
          if-no-files-found: warn
          retention-days: 30
