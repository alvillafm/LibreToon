name: LibreToon Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  windows:
    name: Windows tests and release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1

      - name: Isolate application and test data
        shell: pwsh
        run: |
          $tempDir = Join-Path $env:RUNNER_TEMP "libretoon-tests"
          $appDataDir = Join-Path $env:RUNNER_TEMP "libretoon-appdata"
          New-Item -ItemType Directory -Force $tempDir, $appDataDir | Out-Null
          "TEMP=$tempDir" >> $env:GITHUB_ENV
          "TMP=$tempDir" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$appDataDir" >> $env:GITHUB_ENV

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2

      - name: Run regression tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Test video and GIF export with bundled FFmpeg
        run: cargo test --release --locked export_all_containers_with_ffmpeg -- --ignored --nocapture

      - name: Package Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/libretoon.exe dist/
          Copy-Item assets dist/assets -Recurse
          # CJK font data is embedded in the EXE; retain its license, avoid a second copy.
          Remove-Item dist/assets/fonts/NotoSansCJK-Regular.ttc
          Copy-Item LICENSE dist/
          @"
          LibreToon for Windows x64
          Extract the entire ZIP and open libretoon.exe.
          Keep the assets folder beside the executable; it includes FFmpeg.
          Build commit: ${{ github.sha }}
          "@ | Set-Content dist/LEEME.txt

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: LibreToon-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 7
