name: LibreToon Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  windows:
    name: Windows tests and release
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1

      - name: Isolate application and test data
        shell: pwsh
        run: |
          $tempDir = Join-Path $env:RUNNER_TEMP "libretoon-tests"
          $appDataDir = Join-Path $env:RUNNER_TEMP "libretoon-appdata"
          New-Item -ItemType Directory -Force $tempDir, $appDataDir | Out-Null
          "TEMP=$tempDir" >> $env:GITHUB_ENV
          "TMP=$tempDir" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$appDataDir" >> $env:GITHUB_ENV

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2

      - name: Build owned FFmpeg and complete corresponding source
        shell: pwsh
        run: ./scripts/build-ffmpeg.ps1 -WorkDirectory work/ffmpeg-owned-final

      - name: Reproduce FFmpeg in an independent clean directory
        shell: pwsh
        run: ./scripts/build-ffmpeg.ps1 -WorkDirectory work/ffmpeg-reproduced -ToolDirectory work/ffmpeg-owned-final/tools

      - name: Validate formats, dimensions, colours, frames and quality
        shell: pwsh
        run: ./scripts/test-ffmpeg.ps1 -CandidateDirectory work/ffmpeg-owned-final/output

      - name: Run regression tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Test video and GIF export with candidate in isolation
        shell: pwsh
        run: ./scripts/test-ffmpeg-app.ps1 -CandidateDirectory work/ffmpeg-owned-final/output

      - name: Review sources, link inventory, tests and reproduction
        shell: pwsh
        run: ./scripts/review-ffmpeg.ps1 -CandidateDirectory work/ffmpeg-owned-final/output -ReproducedDirectory work/ffmpeg-reproduced/output

      - name: Package Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/libretoon.exe dist/
          Copy-Item assets dist/assets -Recurse
          # CJK font data is embedded in the EXE; retain its license, avoid a second copy.
          Remove-Item dist/assets/fonts/NotoSansCJK-Regular.ttc
          Copy-Item LICENSE dist/
          # Stage the reviewed candidate; never alter the checked-in fallback during CI.
          Copy-Item work/ffmpeg-owned-final/output/ffmpeg.exe dist/assets/tools/ffmpeg.exe -Force
          Copy-Item work/ffmpeg-owned-final/output/THIRD-PARTY-NOTICES.txt dist/assets/tools/THIRD_PARTY.md -Force
          Copy-Item work/ffmpeg-owned-final/output/licenses/* dist/assets/tools/licenses/ -Force
          Copy-Item work/ffmpeg-owned-final/output/SOURCE_STATUS.json dist/assets/tools/ -Force
          Copy-Item work/ffmpeg-owned-final/output/REVIEW.json dist/assets/tools/BUILD_EVIDENCE.json -Force
          @"
          LibreToon for Windows x64
          Extract the entire ZIP and open libretoon.exe.
          Keep the assets folder beside the executable; it includes FFmpeg.
          Third-party notices: assets/THIRD_PARTY_NOTICES.md
          FFmpeg source and licensing: SOURCE-ACCESS.txt
          Build commit: ${{ github.sha }}
          "@ | Set-Content dist/LEEME.txt

      - name: Require reviewed FFmpeg corresponding source and include it
        shell: pwsh
        run: ./scripts/check-ffmpeg-distribution.ps1 -Destination dist -ManifestPath work/ffmpeg-owned-final/output/SOURCE_STATUS.json -BinaryPath dist/assets/tools/ffmpeg.exe

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: LibreToon-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 7
